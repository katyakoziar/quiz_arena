<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Quiz Arena</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0b0620; font-family: 'Inter', sans-serif; }
  #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  @keyframes pinPulse { 0%,100%{opacity:.25} 50%{opacity:1} }
  @keyframes qaFadeIn { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
  .qa-fade { animation: qaFadeIn 0.28s ease; }
  .qa-opt:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-2px); }
  .qa-opt:active:not(:disabled) { transform: scale(0.98); }
  .qa-btn:active { transform: scale(0.97); }
  ::selection { background: #FFC53D; color: #1C1140; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script src="/app.js"></script>
</body>
</html>
